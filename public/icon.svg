<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F121C" />
      <stop offset="50%" stop-color="#090B10" />
      <stop offset="100%" stop-color="#161B28" />
    </linearGradient>
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF4D8D" />
      <stop offset="50%" stop-color="#EC4899" />
      <stop offset="100%" stop-color="#00F2FE" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="url(#neonGrad)" stroke-width="4" stroke-opacity="0.4" />

  <!-- Stylized Torii / Gateway & Anime Diamond Shards -->
  <g transform="translate(256, 230)" filter="url(#glow)">
    <!-- Top Torii beam -->
    <path d="M -150 -90 Q 0 -115 150 -90 Q 140 -70 130 -75 Q 0 -95 -130 -75 Z" fill="url(#neonGrad)" />
    <!-- Secondary beam -->
    <rect x="-120" y="-55" width="240" height="18" rx="4" fill="url(#neonGrad)" />
    <!-- Pillars -->
    <path d="M -85 -55 L -95 120 L -75 120 L -68 -55 Z" fill="url(#neonGrad)" />
    <path d="M 85 -55 L 95 120 L 75 120 L 68 -55 Z" fill="url(#neonGrad)" />
    <!-- Center Kanji / Stylized Yūgen Motif -->
    <circle cx="0" cy="15" r="42" fill="#090B10" stroke="#FF4D8D" stroke-width="6" />
    <path d="M -16 2 L 0 -18 L 16 2 L 0 22 Z" fill="#00F2FE" />
    <circle cx="0" cy="15" r="8" fill="#FF4D8D" />
  </g>

  <!-- Typography YŪGEN -->
  <text x="256" y="420" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="44" font-weight="800" fill="#FFFFFF" letter-spacing="9" text-anchor="middle">YŪGEN</text>
  <text x="256" y="452" font-family="'Noto Sans JP', sans-serif" font-size="18" font-weight="700" fill="#FF4D8D" letter-spacing="12" text-anchor="middle">幽玄 · 4K STUDIO</text>
</svg>

    <script>
      // Ensure window.fetch is writable and has both a getter and a setter so iframe harnesses/test suites can hook fetch without throwing
      (function() {
        try {
          if (typeof window === 'undefined') return;

          // 1. Traverse prototype chain and ensure any getter on Window/WindowProperties has a matching setter
          var p = window;
          while (p) {
            try {
              var d = Object.getOwnPropertyDescriptor(p, 'fetch');
              if (d && d.configurable) {
                (function(desc, proto) {
                  Object.defineProperty(proto, 'fetch', {
                    get: function() {
                      return this.__custom_fetch__ || (desc.get ? desc.get.call(this) : desc.value);
                    },
                    set: function(val) {
                      this.__custom_fetch__ = val;
                    },
                    configurable: true,
                    enumerable: true
                  });
                })(d, p);
              }
            } catch (errProto) {}
            p = Object.getPrototypeOf(p);
          }

          // 2. Define own property on window with explicit getter and setter
          var nativeFetch = window.fetch ? window.fetch.bind(window) : null;
          var activeFetch = nativeFetch;
          try {
            Object.defineProperty(window, 'fetch', {
              get: function() {
                return activeFetch || (window.__custom_fetch__ || nativeFetch);
              },
              set: function(fn) {
                activeFetch = fn;
                try { window.__custom_fetch__ = fn; } catch (e) {}
              },
              configurable: true,
              enumerable: true
            });
          } catch (errWin) {}
        } catch (e) {
          // Fallback gracefully
        }
      })();
    </script>
